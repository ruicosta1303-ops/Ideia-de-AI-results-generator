[project]
name = "sportsmodel"
version = "0.1.0"
description = "Statistical prediction engine for football matches (Elo, Dixon-Coles Poisson, evaluation metrics)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportsmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
