name: Pipeline
# Downloads real data, forecasts upcoming matches and (weekly, or on demand) re-runs
# the walk-forward backtest. Uses the DATABASE_URL secret when it is set (permanent
# database); otherwise a temporary database that exists only during the job.
on:
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the full backtest (about 10 minutes)"
        type: boolean
        default: true
  schedule:
    - cron: "47 5 * * *"   # every day 05:47 UTC: new data + forecasts
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC: full backtest
  push:
    # only main writes to the production database; other branches are checked by CI
    branches: [main]
    paths:
      - "engine/src/**"
      - "engine/data/**"
      - "db/migrations/**"
      - ".github/workflows/pipeline.yml"
# football-data.org allows 10 requests/minute per token: never run two of these jobs at once
concurrency:
  group: football-data-org
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports
          POSTGRES_DB: sports
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sports" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: engine
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://sports:sports@localhost:5432/sports' }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          DAILY_ONLY: ${{ github.event.schedule == '47 5 * * *' || (github.event_name == 'workflow_dispatch' && !inputs.backtest) }}
          HAS_PERMANENT_DB: ${{ secrets.DATABASE_URL != '' }}
        run: |
          echo "Permanent database configured: $HAS_PERMANENT_DB"
          if [ "$DAILY_ONLY" = "true" ]; then
            uv run python -m sportsmodel.pipeline --out export --skip-backtest
          else
            uv run python -m sportsmodel.pipeline --out export
          fi
      - name: Database status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://sports:sports@localhost:5432/sports' }}
        run: uv run python -m sportsmodel.db_status
      - if: always()
        name: Show report
        run: test -f export/report.md && cat export/report.md | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: export
          path: engine/export/
